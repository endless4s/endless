name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt
      - name: Test and compute coverage
        run: sbt scalafmtCheckAll coverage +test coverageReport coverageAggregate
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt
      - run: sbt versionCheck ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  publishSite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Recent actions/checkout persists its credentials into git worktrees, and
          # github-pages-deploy-action deploys from a worktree. Those credentials win over
          # the deploy token, so the push goes out as github-actions[bot] and is refused by
          # the other repository. Don't persist them.
          persist-credentials: false
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:17
          apps: sbt
      - name: Generate website
        run: sbt documentation/makeSite
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: endless4s/endless4s.github.io
          branch: master
          token: ${{ secrets.DOC_GITHUB_TOKEN }}
          folder: documentation/target/site
